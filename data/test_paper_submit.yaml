- feature: 试卷模块
  story: 试卷提交接口
  title: 提交试卷-选择题答对(题目1,correct='A',答案'A')
  request:
    method: POST
    url: http://localhost:8000/api/student/exampaper/answer/answerSubmit
    headers:
      Content-Type: application/json
    json:
      questionId: null
      doTime: 14
      answerItems:
        - questionId: 1
          content: "A"
          contentArray: []
          completed: true
          itemOrder: 1
      id: 1
  validate:
    code: 500
    message: "系统内部错误"

