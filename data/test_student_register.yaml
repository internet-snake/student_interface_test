- feature: 用户模块
  story: 注册接口
  title: 注册失败-用户名已存在(student)
  request:
    method: POST
    url: http://localhost:8000/api/student/user/register
    headers:
      Content-Type: application/json
    json:
      userName: "student"
      password: "123456"
      userLevel: 1
  validate:
    code: 0

