- # 学生注册接口测试数据
  feature: 注册模块
  story: 学生注册接口
  title: 成功注册用例
  request:
    method: POST
    url: http://localhost:8000/api/student/user/register
    headers:
      Content-Type: application/json
    json:
      userName: "student2"
      password: "123456"
      userLevel: 1
  validate:
    code: 1
    message: 成功
-
  feature: 注册模块
