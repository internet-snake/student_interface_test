- feature: 用户模块
  story: 登录接口
  title: 登录失败-用户名包含特殊字符(SQL注入)
  request:
    method: POST
    url: http://localhost:8000/api/user/login
    headers:
      Content-Type: application/json
    json:
      userName: "student'; DROP TABLE users; --"
      password: "123456"
      remember: false
  validate:
    code: 402
    message: "用户名或密码错误"

- feature: 用户模块
