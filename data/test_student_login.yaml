- feature: 用户模块
  story: 登录接口
  title: 正常登录-学生账号student
  request:
    method: POST
    url: http://localhost:8000/api/user/login
    headers:
      Content-Type: application/json
    json:
      userName: "student"
      password: "123456"
      remember: false
  validate:
    code: 1
    message: 成功

