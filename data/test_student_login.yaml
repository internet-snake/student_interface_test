- # 学生登录接口测试数据1
  feature: 登录模块
  story: 学生登录接口
  title: 成功登录用例
  request:
    method: POST
    url: http://localhost:8000/api/user/login
    headers:
      Content-Type: application/json
    json:
      userName: "student"
      password: "123456"
      remember: false
  validate:
    code: 1
    message: 成功
